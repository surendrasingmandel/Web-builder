<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Website Builder</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            min-height: 100dvh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            background-color: #0f172a;
            color: #f8fafc;
        }
        #main-container {
            display: flex;
            flex: 1;
            overflow: hidden;
        }
        #sidebar {
            width: 260px;
            flex-shrink: 0;
            display: flex;
            flex-direction: column;
            border-right: 1px solid #334155;
        }
        #content-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            position: relative;
        }
        #footer-input {
            flex-shrink: 0;
            padding: 1rem;
            border-top: 1px solid #334155;
            background: #1e293b;
        }
        iframe {
            background: white;
            width: 100%;
            height: 100%;
            border: none;
        }
        .custom-scrollbar::-webkit-scrollbar {
            width: 5px;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: #475569;
            border-radius: 10px;
        }
        .hidden { display: none !important; }
        .modal-overlay {
            background: rgba(0,0,0,0.8);
            backdrop-filter: blur(4px);
        }
    </style>
</head>
<body>

    <header class="h-14 border-b border-slate-700 flex items-center justify-between px-4 bg-slate-900">
        <div class="flex items-center space-x-2">
            <div class="flex space-x-1.5">
                <div class="w-3 h-3 rounded-full bg-red-500"></div>
                <div class="w-3 h-3 rounded-full bg-yellow-500"></div>
                <div class="w-3 h-3 rounded-full bg-green-500"></div>
            </div>
            <span class="ml-4 font-semibold text-slate-300 text-sm">AI Web Architect</span>
        </div>

        <div class="flex items-center space-x-2">
            <div class="bg-slate-800 p-1 rounded-lg flex">
                <button id="toggle-preview" onclick="setView('preview')" class="px-4 py-1 text-xs rounded-md bg-blue-600 text-white transition">Preview</button>
                <button id="toggle-code" onclick="setView('code')" class="px-4 py-1 text-xs rounded-md text-slate-400 hover:text-white transition">Code</button>
            </div>
            <button onclick="downloadCode()" class="bg-slate-700 hover:bg-slate-600 p-2 rounded-md text-xs flex items-center">
                <i class="fas fa-download mr-2"></i> Download
            </button>
        </div>
    </header>

    <div id="main-container">
        <aside id="sidebar" class="bg-slate-900">
            <div class="p-4">
                <button onclick="newProject()" class="w-full bg-blue-600 hover:bg-blue-500 text-white font-medium py-2 px-4 rounded-lg flex items-center justify-center transition">
                    <i class="fas fa-plus mr-2"></i> New Project
                </button>
            </div>
            
            <nav id="project-list" class="flex-1 overflow-y-auto px-2 space-y-1 custom-scrollbar">
                </nav>

            <div class="p-4 border-t border-slate-700">
                <button onclick="toggleSettings(true)" class="flex items-center text-slate-400 hover:text-white transition w-full">
                    <i class="fas fa-cog mr-3"></i> Settings
                </button>
            </div>
        </aside>

        <main id="content-area">
            <div id="preview-container" class="w-full h-full">
                <iframe id="preview-frame"></iframe>
            </div>
            <div id="code-container" class="w-full h-full hidden">
                <textarea id="code-editor" class="w-full h-full bg-slate-950 text-emerald-400 p-6 font-mono text-sm outline-none resize-none" spellcheck="false"></textarea>
            </div>
            
            <div id="loader" class="absolute inset-0 bg-slate-900/50 flex items-center justify-center hidden">
                <div class="animate-spin rounded-full h-12 w-12 border-t-2 border-b-2 border-blue-500"></div>
            </div>
        </main>
    </div>

    <footer id="footer-input">
        <div class="max-w-4xl mx-auto flex items-end space-x-3">
            <textarea id="user-prompt" rows="1" placeholder="Describe the website you want to build..." 
                class="flex-1 bg-slate-800 border border-slate-600 rounded-xl px-4 py-3 text-white focus:outline-none focus:ring-2 focus:ring-blue-500 resize-none max-h-32"></textarea>
            <button id="send-btn" onclick="generateWeb()" class="bg-blue-600 hover:bg-blue-500 text-white p-3 rounded-xl transition">
                <i class="fas fa-paper-plane"></i>
            </button>
        </div>
    </footer>

    <div id="settings-modal" class="fixed inset-0 modal-overlay z-50 flex items-center justify-center hidden">
        <div class="bg-slate-800 w-full max-w-md rounded-2xl p-6 shadow-2xl border border-slate-700">
            <h2 class="text-xl font-bold mb-6">Configuration</h2>
            <div class="space-y-4">
                <div>
                    <label class="block text-xs font-semibold text-slate-400 mb-1 uppercase">API URL</label>
                    <input id="set-url" type="text" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2 text-sm text-white">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-400 mb-1 uppercase">API Key</label>
                    <input id="set-key" type="password" placeholder="sk-or-..." class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2 text-sm text-white">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-400 mb-1 uppercase">Model ID</label>
                    <input id="set-model" type="text" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2 text-sm text-white">
                </div>
            </div>
            <div class="mt-8 flex justify-end space-x-3">
                <button onclick="toggleSettings(false)" class="px-4 py-2 text-slate-400 hover:text-white transition">Cancel</button>
                <button onclick="saveSettings()" class="bg-blue-600 hover:bg-blue-500 px-6 py-2 rounded-lg font-bold transition">Save Config</button>
            </div>
        </div>
    </div>

    <script>
        const SYSTEM_PROMPT = "You are a senior web developer. Output ONLY raw HTML code including Tailwind CSS via CDN. Do not explain, do not use markdown code blocks, do not provide any text before or after the HTML.";
        
        let projects = JSON.parse(localStorage.getItem('ai_projects') || '[]');
        let activeProjectId = null;
        
        const config = {
            url: localStorage.getItem('api_url') || "https://openrouter.ai/api/v1/chat/completions",
            key: localStorage.getItem('api_key') || "",
            model: localStorage.getItem('api_model') || "deepseek/deepseek-r1:free"
        };

        // Initialize
        window.onload = () => {
            document.getElementById('set-url').value = config.url;
            document.getElementById('set-key').value = config.key;
            document.getElementById('set-model').value = config.model;
            renderProjects();
        };

        function setView(view) {
            const isPreview = view === 'preview';
            document.getElementById('preview-container').classList.toggle('hidden', !isPreview);
            document.getElementById('code-container').classList.toggle('hidden', isPreview);
            
            document.getElementById('toggle-preview').className = isPreview 
                ? 'px-4 py-1 text-xs rounded-md bg-blue-600 text-white transition' 
                : 'px-4 py-1 text-xs rounded-md text-slate-400 hover:text-white transition';
            
            document.getElementById('toggle-code').className = !isPreview 
                ? 'px-4 py-1 text-xs rounded-md bg-blue-600 text-white transition' 
                : 'px-4 py-1 text-xs rounded-md text-slate-400 hover:text-white transition';
        }

        function toggleSettings(show) {
            document.getElementById('settings-modal').classList.toggle('hidden', !show);
        }

        function saveSettings() {
            config.url = document.getElementById('set-url').value;
            config.key = document.getElementById('set-key').value;
            config.model = document.getElementById('set-model').value;
            
            localStorage.setItem('api_url', config.url);
            localStorage.setItem('api_key', config.key);
            localStorage.setItem('api_model', config.model);
            
            toggleSettings(false);
        }

        async function generateWeb() {
            const promptInput = document.getElementById('user-prompt');
            const prompt = promptInput.value.trim();
            if (!prompt) return;
            if (!config.key) {
                alert("Please set your API Key in Settings first.");
                toggleSettings(true);
                return;
            }

            document.getElementById('loader').classList.remove('hidden');
            
            try {
                const response = await fetch(config.url, {
                    method: 'POST',
                    headers: {
                        'Authorization': `Bearer ${config.key}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        model: config.model,
                        messages: [
                            { role: "system", content: SYSTEM_PROMPT },
                            { role: "user", content: prompt }
                        ]
                    })
                });

                // Anti-Crash JSON Logic
                const rawText = await response.text();
                
                if (!response.ok) {
                    alert("API Error: " + rawText);
                    return;
                }

                const data = JSON.parse(rawText);
                let html = data.choices[0].message.content;
                
                // Clean up any potential markdown wrap if AI ignored system instructions
                html = html.replace(/```html/g, '').replace(/```/g, '').trim();

                updateCurrentProject(prompt, html);
                promptInput.value = '';
            } catch (err) {
                alert("Critical Error: " + err.message);
            } finally {
                document.getElementById('loader').classList.add('hidden');
            }
        }

        function updateCurrentProject(name, code) {
            const id = activeProjectId || Date.now();
            const project = {
                id: id,
                name: name.substring(0, 25) + (name.length > 25 ? '...' : ''),
                code: code,
                timestamp: Date.now()
            };

            const index = projects.findIndex(p => p.id === id);
            if (index > -1) projects[index] = project;
            else projects.unshift(project);

            activeProjectId = id;
            localStorage.setItem('ai_projects', JSON.stringify(projects));
            
            renderProjects();
            loadCodeIntoUI(code);
        }

        function loadCodeIntoUI(code) {
            const iframe = document.getElementById('preview-frame');
            iframe.srcdoc = code;
            document.getElementById('code-editor').value = code;
        }

        function renderProjects() {
            const container = document.getElementById('project-list');
            container.innerHTML = projects.map(p => `
                <div onclick="switchProject(${p.id})" class="p-3 rounded-lg cursor-pointer transition ${activeProjectId === p.id ? 'bg-slate-800 text-white' : 'text-slate-400 hover:bg-slate-800/50 hover:text-slate-200'}">
                    <i class="fas fa-file-code mr-2 text-blue-400"></i>
                    <span class="text-sm truncate">${p.name}</span>
                </div>
            `).join('');
        }

        function switchProject(id) {
            activeProjectId = id;
            const project = projects.find(p => p.id === id);
            if (project) {
                loadCodeIntoUI(project.code);
                renderProjects();
            }
        }

        function newProject() {
            activeProjectId = null;
            document.getElementById('user-prompt').value = '';
            loadCodeIntoUI('');
            renderProjects();
        }

        function downloadCode() {
            const code = document.getElementById('code-editor').value;
            if (!code) return alert("No code to download");
            const blob = new Blob([code], { type: 'text/html' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `website-${Date.now()}.html`;
            a.click();
        }

        // Handle auto-expand textarea
        const tx = document.getElementById('user-prompt');
        tx.addEventListener("input", function() {
            this.style.height = "auto";
            this.style.height = (this.scrollHeight) + "px";
        }, false);
    </script>
</body>
</html>
